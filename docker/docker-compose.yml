services:

  api:
    image: prodml-api:0.1.0
    container_name: prodml-api
    ports:
      - "8000:8000"
    environment:
      PRODML_MODEL_PATH: /app/models/baseline.pkl
      PRODML_ONNX_PATH: /app/models/model.onnx
      PRODML_MODEL_VERSION: "0.1.0"
      PRODML_TRAINING_DATE: "2026-08-30"
      PRODML_FRAMEWORK: "scikit-learn"
      PRODML_MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ../models:/app/models:ro
    restart: unless-stopped
    depends_on:
      - mlflow

  postgres:
    image: postgres:16
    container_name: prodml-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: prodml-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: prodml-mlflow
    depends_on:
      - postgres
      - minio
    ports:
      - "5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://mlflow:mlflow@postgres:5432/mlflow
      - --artifacts-destination
      - s3://mlflow
      - --serve-artifacts
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
